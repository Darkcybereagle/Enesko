<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Enesko Phase 1 & 2 Test</title>
  <style>
    body{font-family:Arial,sans-serif;max-width:760px;margin:60px auto;padding:0 20px;background:#07182d;color:#fff}
    .card{background:#102744;padding:24px;border-radius:16px}
    input,button{box-sizing:border-box;width:100%;padding:14px;margin-top:12px;border:0;border-radius:10px}
    button{background:#2878ff;color:#fff;font-weight:700;cursor:pointer}
    pre{white-space:pre-wrap;background:#07182d;padding:16px;border-radius:10px;min-height:80px}
    .hint{color:#a9bdd4;font-size:14px}
  </style>
</head>
<body>
  <h1>ENESKO</h1>
  <p>Phase 1 + Phase 2 local test</p>
  <div class="card">
    <label for="message">Ask Enesko</label>
    <input id="message" value="Where can I buy sports shoes?">
    <button id="send">Send</button>
    <p class="hint">Also test: “How many parking spaces are free right now?”</p>
    <pre id="result">Ready.</pre>
  </div>
<script>
const input=document.getElementById("message");
const result=document.getElementById("result");
document.getElementById("send").onclick=async()=>{
  result.textContent="Loading...";
  try{
    const response=await fetch("/api/v1/assistant/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message:input.value,channel:"web"})
    });
    const data=await response.json();
    result.textContent=JSON.stringify(data,null,2);
  }catch(error){
    result.textContent="Request failed: "+error.message;
  }
};
</script>
</body>
</html>
